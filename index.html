<script type="text/babel" data-source="components/primitives.jsx">
const { useState, useEffect, useMemo, useRef } = React;

function Halftone({ className = "", style = {} }) {
  return <div className={`halftone-paper ${className}`} style={style} />;
}

function EdgeTicks({ side = "left", count = 14, prefix = "" }) {
  const items = Array.from({ length: count }, (_, i) => String(i + 1).padStart(2, "0"));
  return (
    <div className={`edge-ticks ${side}`}>
      {items.map((n) => (
        <div key={n} className="t">{prefix}{n}</div>
      ))}
    </div>
  );
}

function Marquee({ children }) {
  return (
    <div className="marquee">
      <div className="marquee-track">{children} &nbsp;&middot;&nbsp; {children} &nbsp;&middot;&nbsp; {children}</div>
    </div>
  );
}

<script type="text/babel" data-source="components/map.jsx">
function MapView({ entries, onSelect, hover, setHover, selected }) {
  const hostRef = React.useRef(null);
  const mapRef = React.useRef(null);
  const markersRef = React.useRef({});
  const cbRef = React.useRef({ onSelect, setHover });
  cbRef.current = { onSelect, setHover };

  React.useEffect(() => {
    if (!hostRef.current || mapRef.current) return;
    const host = hostRef.current;
    const map = L.map(host, {
      center: [54, 10],
      zoom: 4,
      zoomControl: false,
      attributionControl: true,
      worldCopyJump: false,
      minZoom: 2,
      maxZoom: 12,
      zoomSnap: 0.25,
    });
    fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json")
      .then(r => r.json())
      .then(topo => {
        if (!mapRef.current) return;
        const bbox = (geom) => {
          let w = 180, e = -180, s = 90, n = -90;
          const walk = (c) => {
            if (typeof c[0] === "number") {
              if (c[0] < w) w = c[0];
              if (c[0] > e) e = c[0];
              if (c[1] < s) s = c[1];
              if (c[1] > n) n = c[1];
              return;
            }
            for (let i = 0; i < c.length; i++) walk(c[i]);
          };
          if (!geom || !geom.coordinates) return null;
          walk(geom.coordinates);
          return e < w ? null : { w, e, s, n };
        };
        const inFrame = (f) => {
          const b = bbox(f.geometry);
          if (!b) return false;
          if (b.e - b.w > 90) return false;
          return b.e > -32 && b.w < 46 && b.n > 30 && b.s < 74;
        };
        const features = [];
        const geoms = topo.objects.countries.geometries;
        for (let i = 0; i < geoms.length; i++) {
          const f = topojson.feature(topo, geoms[i]);
          if (inFrame(f)) features.push(f);
        }
        const ISLANDS = {
          Gotland: [[57.95,18.75],[57.60,18.98],[57.25,18.72],[57.03,18.20],[57.35,18.10],[57.72,18.30]],
          Bornholm: [[55.30,14.68],[55.13,15.15],[54.99,15.08],[55.00,14.70],[55.15,14.66]],
          Shetland: [[60.85,-0.88],[60.60,-0.95],[60.15,-1.10],[59.87,-1.28],[60.15,-1.45],[60.60,-1.35]],
          Hebrides: [[58.52,-6.20],[58.20,-6.20],[57.75,-6.85],[57.90,-7.15],[58.25,-6.95],[58.50,-6.60]],
          Saaremaa: [[58.60,22.10],[58.50,23.00],[58.20,23.00],[57.92,22.05],[58.25,21.85]],
          Oland: [[57.37,17.05],[56.95,16.85],[56.20,16.40],[56.45,16.35],[57.10,16.70]],
          Gozo: [[36.09,14.18],[36.05,14.32],[36.01,14.30],[36.02,14.18]],
        };
        Object.keys(ISLANDS).forEach(k => {
          features.push({
            type: "Feature",
            properties: { name: k, synthetic: true },
            geometry: { type: "Polygon", coordinates: [ISLANDS[k].map(p => [p[1], p[0]]).concat([[ISLANDS[k][0][1], ISLANDS[k][0][0]]])] },
          });
        });
        const fc = { type: "FeatureCollection", features };
        const layer = L.geoJSON(fc, {
          pane: "tilePane",
          style: { fillColor: "#eeeeec", fillOpacity: 1, color: "#dcdcd8", weight: 0.8 },
          interactive: false,
        }).addTo(mapRef.current);

        const wanted = new Set(
          Array.from(new Set(window.REGISTRY.map(e => e.country)))
            .map(cc => window.COUNTRY_NAMES[cc])
            .filter(Boolean)
        );
        const biggestRing = (geom) => {
          const polys = geom.type === "Polygon" ? [geom.coordinates] : geom.coordinates;
          let best = null, bestArea = -1;
          polys.forEach(p => {
            const ring = p[0];
            let a = 0;
            for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
              a += ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1];
            }
            a = Math.abs(a / 2);
            if (a > bestArea) { bestArea = a; best = ring; }
          });
          if (!best) return null;
          let cx = 0, cy = 0, signed = 0;
          for (let i = 0, j = best.length - 1; i < best.length; j = i++) {
            const cross = best[j][0] * best[i][1] - best[i][0] * best[j][1];
            signed += cross;
            cx += (best[j][0] + best[i][0]) * cross;
            cy += (best[j][1] + best[i][1]) * cross;
          }
          if (!signed) return null;
          return { at: [cy / (3 * signed), cx / (3 * signed)], area: bestArea };
        };
        const anchors = {
          "Norway": [62.8, 7.4],
          "Sweden": [60.2, 14.4],
          "Portugal": [40.9, -9.9],
          "Spain": [39.9, -4.2],
          "Italy": [43.0, 12.4],
          "Greece": [39.3, 22.2],
          "Denmark": [56.2, 9.2],
          "Finland": [63.6, 26.8],
          "United Kingdom": [53.4, -2.2],
          "Ireland": [53.3, -8.6],
          "Croatia": [45.2, 16.4],
        };
        const labels = [];
        const weight = {};
        window.REGISTRY.forEach(e => {
          const n = window.COUNTRY_NAMES[e.country];
          if (n) weight[n] = (weight[n] || 0) + 1;
        });
        layer.eachLayer(l => {
          const name = l.feature && l.feature.properties && l.feature.properties.name;
          if (!name || l.feature.properties.synthetic || !wanted.has(name)) return;
          const r = biggestRing(l.feature.geometry);
          if (!r) return;
          const bb = bbox(l.feature.geometry);
          const mk = L.marker(anchors[name] || r.at, {
            interactive: false,
            keyboard: false,
            icon: L.divIcon({ className: "emr-country-label", html: name, iconSize: null }),
          }).addTo(mapRef.current);
          labels.push({ mk, bb, area: r.area, rank: r.area + (weight[name] || 0) * 2 });
        });
        labels.sort((a, b) => b.rank - a.rank);
        const overlaps = (a, b) =>
          a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
        const dirs = [[0, 0]];
        for (const ang of [90, 270, 0, 180, 45, 135, 225, 315]) {
          const t = ang * Math.PI / 180;
          dirs.push([Math.cos(t), Math.sin(t)]);
        }
        const syncLabels = () => {
          const map = mapRef.current;
          if (!map) return;
          const pins = [];
          window.REGISTRY.forEach(e => {
            const c = window.COORDS[e.place];
            if (!c) return;
            const p = map.latLngToContainerPoint(c);
            pins.push({ left: p.x - 9, right: p.x + 9, top: p.y - 9, bottom: p.y + 9 });
          });
          const taken = [];
          let unmeasured = false;
          labels.forEach(({ mk, bb, area }) => {
            const el = mk.getElement();
            if (!el) return;
            el.style.display = "";
            const w = el.offsetWidth, h = el.offsetHeight;
            if (!w || !h) { unmeasured = true; return; }
            if (area < 1.5 && map.getZoom() < 6) { el.style.display = "none"; return; }
            const reach = Math.max(11, Math.min(16, h + 3));
            const shift = [];
            for (const d of dirs) {
              if (d[0] === 0 && d[1] === 0) { shift.push([0, 0]); continue; }
              shift.push([Math.round(d[0] * reach * 0.6), Math.round(d[1] * reach * 0.6)]);
            }
            for (const d of dirs) {
              if (d[0] === 0 && d[1] === 0) continue;
              shift.push([Math.round(d[0] * reach), Math.round(d[1] * reach)]);
            }
            const p = map.latLngToContainerPoint(mk.getLatLng());
            let placed = null, fallback = null;
            for (let i = 0; i < shift.length; i++) {
              const dx = shift[i][0], dy = shift[i][1];
              const left = p.x + dx - w / 2, top = p.y + dy - h / 2;
              const box = { left: left - 1, right: left + w + 1, top: top - 1, bottom: top + h + 1 };
              if (taken.some(t => overlaps(box, t))) continue;
              const cand = { dx: dx - w / 2, dy: dy - h / 2, box };
              if (!fallback) fallback = cand;
              if (pins.some(q => overlaps(box, q))) continue;
              placed = cand;
              break;
            }
            const use = placed || fallback;
            if (!use) { el.style.display = "none"; return; }
            el.style.marginLeft = use.dx + "px";
            el.style.marginTop = use.dy + "px";
            taken.push(use.box);
          });
          if (unmeasured) setTimeout(syncLabels, 120);
        };
        let queued = 0;
        const queueLabels = () => {
          if (queued) return;
          queued = requestAnimationFrame(() => { queued = 0; syncLabels(); });
        };
        mapRef.current.on("zoomend moveend", queueLabels);
        setTimeout(syncLabels, 300);
        syncLabels();
      })
      .catch(() => {});
    L.control.zoom({ position: "bottomright" }).addTo(map);
    mapRef.current = map;
    map.attributionControl.addAttribution("Geometry: Natural Earth");

    const lats = [], lngs = [];
    Object.keys(window.COORDS).forEach(k => {
      const c = window.COORDS[k];
      if (c) { lats.push(c[0]); lngs.push(c[1]); }
    });
    const BOUNDS = lats.length
      ? [[Math.min(...lats) - 1.5, Math.min(...lngs) - 1.5],
         [Math.max(...lats) + 1.5, Math.max(...lngs) + 1.5]]
      : [[35, -24], [67, 34]];
    let framed = false, touched = false, lastW = 0, lastH = 0;
    const fit = () => map.fitBounds(BOUNDS, { animate: false, padding: [14, 14] });
    const sync = () => {
      const m = mapRef.current;
      if (!m) return;
      m.invalidateSize();
      const w = host.clientWidth, h = host.clientHeight;
      if (w === 0 || h === 0) return;
      const reshaped = Math.abs(w - lastW) > 2 || Math.abs(h - lastH) > 2;
      lastW = w; lastH = h;
      if (!framed || (reshaped && !touched)) { framed = true; fit(); }
    };
    const markTouched = () => { touched = true; };
    host.addEventListener("wheel", markTouched, { passive: true });
    host.addEventListener("pointerdown", markTouched);
    const raf1 = requestAnimationFrame(() => { sync(); });
    const raf2 = requestAnimationFrame(() => requestAnimationFrame(sync));
    const t = setTimeout(sync, 250);
    const ro = new ResizeObserver(() => sync());
    ro.observe(host);
    return () => {
      cancelAnimationFrame(raf1); cancelAnimationFrame(raf2); clearTimeout(t);
      ro.disconnect();
      host.removeEventListener("wheel", markTouched);
      host.removeEventListener("pointerdown", markTouched);
      map.remove(); mapRef.current = null;
    };
  }, []);

  React.useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    Object.values(markersRef.current).forEach(m => m.remove());
    markersRef.current = {};
    entries.forEach(e => {
      const ll = window.COORDS[e.place];
      if (!ll) return;
      const m = L.circleMarker([ll[0], ll[1]], {
        radius: 5,
        color: "#ffffff",
        weight: 1.5,
        fillColor: "#111111",
        fillOpacity: 1,
      }).addTo(map);
      m.on("mouseover", () => cbRef.current.setHover(e));
      m.on("mouseout", () => cbRef.current.setHover(null));
      m.on("click", () => cbRef.current.onSelect(e));
      markersRef.current[e.id] = m;
    });
  }, [entries]);

  React.useEffect(() => {
    const hotId = hover?.id || selected?.id;
    Object.entries(markersRef.current).forEach(([id, m]) => {
      const hot = id === hotId;
      m.setStyle({ fillColor: hot ? "#111" : "#111", weight: hot ? 3 : 1.5 });
      m.setRadius(hot ? 8 : 5);
    });
  }, [hover, selected, entries]);

  return (
    <div style={{ position: "absolute", inset: 0, background: "#ffffff" }}>
      <div ref={hostRef} className="emr-map" style={{ position: "absolute", inset: 0 }} />
    </div>
  );
}

Object.assign(window, { MapView });
</script>

<script type="text/babel" data-source="components/fund.jsx">
const FUND = {
  paper: "#ffffff",
  ink: "#111111",
  line: "#111111",
  muted: "#6b6b6b",
  canvas: "#0f1117",   // dark navy-ish
  canvas2: "#141621",
  hairline: "rgba(17,17,17,0.15)",
};

function EMRMark({ size = 20 }) {
  const RY = 0.5, TILT = -22 * Math.PI / 180, SR = 0.13, GAP = 11;
  const pts = [];
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6 - Math.PI / 2;
    const px = Math.cos(a), py = RY * Math.sin(a);
    pts.push({
      x: px * Math.cos(TILT) - py * Math.sin(TILT),
      y: px * Math.sin(TILT) + py * Math.cos(TILT),
    });
  }
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  pts.forEach(q => {
    x0 = Math.min(x0, q.x - SR); x1 = Math.max(x1, q.x + SR);
    y0 = Math.min(y0, q.y - SR); y1 = Math.max(y1, q.y + SR);
  });
  const k = Math.min(90 / (x1 - x0), 90 / (y1 - y0));
  const ox = 48 - ((x0 + x1) / 2) * k, oy = 48 - ((y0 + y1) / 2) * k;
  const R = SR * k;
  const d = pts.filter((q, i) => i !== GAP).map(q => {
    const cx = q.x * k + ox, cy = q.y * k + oy;
    let p = "";
    for (let j = 0; j < 10; j++) {
      const rr = j % 2 ? R * 0.382 : R, a = (j / 10) * Math.PI * 2 - Math.PI / 2;
      p += (j ? "L" : "M") + (cx + Math.cos(a) * rr).toFixed(2) + "," + (cy + Math.sin(a) * rr).toFixed(2);
    }
    return p + "Z";
  }).join("");
  return (
    <svg viewBox="0 0 96 96" width={size} height={size} fill="currentColor" aria-hidden="true" style={{ display: "block", flex: "none" }}>
      <path d={d}></path>
    </svg>
  );
}

        </div>

    </div>

}

function FundRow({ entry, onSelect, onHover, selected, hovered }) {
  return (
    <div
      onMouseEnter={() => onHover(entry)}
      onMouseLeave={() => onHover(null)}
      onClick={() => onSelect(entry)}

        background: selected || hovered ? "#f2f0eb" : "transparent",

        minHeight: 44,
      }}
    >
      <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
        <span style={{ color: FUND.ink, fontWeight: 400 }}>{entry.name}</span>
        <span style={{ color: FUND.muted, fontSize: 12 }}>{entry.place}, {window.COUNTRY_NAMES[entry.country]}</span>
      </div>
      <div style={{ color: FUND.ink, textTransform: "capitalize" }}>
        {entry.material}{entry.scale !== "industrial" ? `, ${entry.scale}` : ""}
      </div>
    </div>

}

function FundGallery({ entries, onSelect, hover, limit }) {
  const resident = entries[0];

<script type="text/babel" data-source="components/fund_geography.jsx">
function FundGeography({ entries, filtered, query, setQuery, filters, setFilters, selected, setSelected, hover, setHover }) {
  const allMats = ["all","steel","ceramic","glass","wool","wood","stone","paper"];

  function toggleMat(m) {
    setFilters(f => ({ ...f, material: f.material === m ? "all" : m }));
  }

  const byCountry = {};
  filtered.forEach(e => {
    if (!byCountry[e.country]) byCountry[e.country] = [];
    byCountry[e.country].push(e);
  });
  const countryKeys = Object.keys(byCountry).sort((a,b) =>
    (window.COUNTRY_NAMES[a] || a).localeCompare(window.COUNTRY_NAMES[b] || b)
  );

  return (
    <div className="emr-split emr-split-map" style={{ display: "grid", gridTemplateColumns: "minmax(420px, 1fr) 1.6fr", height: "calc(100vh - 51px)", fontFamily: "'Helvetica Neue', Helvetica, Arial, sans-serif", background: FUND.paper }}>

      <div style={{ display: "flex", flexDirection: "column", borderRight: `1px solid ${FUND.line}`, overflow: "hidden" }}>
        <div style={{ borderBottom: `1px solid ${FUND.line}`, padding: "10px 22px" }}>
          <input
            value={query}
            onChange={e => setQuery(e.target.value)}
            placeholder="Search place, region, country…"
            style={{ width: "100%", border: "none", outline: "none", background: "transparent", fontSize: 15, fontFamily: "inherit", padding: "4px 0" }}
          />
        </div>
        <div style={{ borderBottom: `1px solid ${FUND.line}`, padding: "10px 22px", fontSize: 14, lineHeight: 1.5, display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 16 }}>
          <div>
          {allMats.map((m, i) => (
            <span key={m}>
              <button
                onClick={() => toggleMat(m)}
                style={{
                  background: "transparent", border: "none", padding: 0, cursor: "pointer",
                  fontFamily: "inherit", fontSize: 14, color: FUND.ink,
                  textDecoration: filters.material === m ? "underline" : "none",
                  textUnderlineOffset: 3,
                }}
              >
                {m === "all" ? "All" : m.charAt(0).toUpperCase() + m.slice(1)}
              </button>
              {i < allMats.length - 1 && <span>, </span>}
            </span>
          ))}
          </div>
          <span style={{ color: FUND.muted, fontSize: 13, whiteSpace: "nowrap" }}>{filtered.length} makers</span>

          {countryKeys.map(cc => (
            <div key={cc}>
              <div style={{ padding: "16px 22px 6px", fontSize: 12, color: FUND.muted, letterSpacing: "0.04em", textTransform: "uppercase", borderTop: `1px solid ${FUND.hairline}` }}>
                {window.COUNTRY_NAMES[cc]} <span style={{ opacity: 0.6 }}>· {cc}</span>
              </div>
              {byCountry[cc].map(e => (
                <div
                  key={e.id}
                  onMouseEnter={() => setHover(e)}
                  onMouseLeave={() => setHover(null)}
                  onClick={() => setSelected(e)}
                  style={{
                    display: "grid",
                    gridTemplateColumns: "1.3fr 1fr",
                    padding: "10px 22px",
                    cursor: "pointer",
                    background: (selected?.id === e.id || hover?.id === e.id) ? "#f2f0eb" : "transparent",
                    fontSize: 14,
                    alignItems: "center",
                  }}
                >
                  <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                    <span>{e.place}</span>
                    <span style={{ color: FUND.muted, fontSize: 12 }}>{e.region}</span>
                  </div>
                  <div style={{ color: FUND.muted, textTransform: "capitalize", fontSize: 13 }}>
                    {e.material} · {e.process}
                  </div>
                </div>
              ))}
            </div>
          ))}
          {filtered.length === 0 && (
            <div style={{ padding: "40px 22px", color: FUND.muted, fontSize: 13 }}>No entries match these filters.</div>
          )}
        </div>

        <div style={{ borderTop: `1px solid ${FUND.line}`, padding: "10px 22px", display: "flex", justifyContent: "space-between", gap: 12, fontSize: 12, color: FUND.muted, whiteSpace: "nowrap" }}>
          <span>© 2026 EMR</span>
          <span>Map · Europe</span>
        </div>
      </div>

        <MapView
          entries={filtered}
          onSelect={setSelected}
          hover={hover} setHover={setHover}

        {hover && (
          <div style={{ position: "absolute", bottom: 22, left: 22, background: "#fff", border: `1px solid ${FUND.line}`, padding: "10px 14px", maxWidth: 320 }}>
            <div style={{ fontSize: 12, color: FUND.muted, marginBottom: 2 }}>{hover.id} · {window.COUNTRY_NAMES[hover.country]}</div>

<script type="text/babel" data-source="components/fund_submit.jsx">
function FundSubmit({ setScreen, registry, showGrid, onSelect }) {
  const [form, setForm] = React.useState({ place: "", region: "", country: "", name: "", material: "", process: "", scale: "", founded: "", blurb: "", email: "", imageName: "", imageUrl: "" });
  const [sent, setSent] = React.useState(false);
  const mats = ["steel","ceramic","glass","wool","wood","stone","paper"];
  const scales = ["artisan","small-batch","industrial"];
  function up(k, v) { setForm(f => ({ ...f, [k]: v })); }

  return (
    <div className="emr-split" style={{ display: "grid", gridTemplateColumns: showGrid ? "minmax(480px, 1fr) 1.3fr" : "1fr", height: "calc(100vh - 51px)", fontFamily: "'Helvetica Neue', Helvetica, Arial, sans-serif", background: FUND.paper }}>

        </div>

        {sent ? (
          <div style={{ flex: 1, padding: "22px", fontSize: 15, lineHeight: 1.55 }}>
            <div style={{ marginBottom: 10 }}>Queued for review.</div>
            <div style={{ color: FUND.muted, fontSize: 14, marginBottom: 20 }}>
              {form.name} — {form.place}, {form.country}. Audit trail sent to {form.email}.
            </div>
            <button onClick={() => setScreen("registry")} style={{ background: "transparent", border: "none", padding: 0, cursor: "pointer", fontFamily: "inherit", fontSize: 15, color: FUND.ink, textDecoration: "underline", textUnderlineOffset: 3 }}>
              Back to the Index →
            </button>
          </div>
        ) : (
          <React.Fragment>
            <div style={{ flex: 1, overflowY: "auto" }}>

              <FundField label="Place *" value={form.place} onChange={v => up("place", v)} placeholder="Town or city" />
              <FundField label="Region" value={form.region} onChange={v => up("region", v)} placeholder="County, province, or län" />
              <FundField label="Country code *" value={form.country} onChange={v => up("country", v.toUpperCase().slice(0,2))} placeholder="Two letters, e.g. IS" />
              <FundPick label="Material *" value={form.material} options={mats} onChange={v => up("material", v)} />
              <FundField label="Process" value={form.process} onChange={v => up("process", v)} placeholder="e.g. mouth-blown, quarried, spun" />
              <FundPick label="Scale" value={form.scale} options={scales} onChange={v => up("scale", v)} />
              <FundField label="Year established" value={form.founded} onChange={v => up("founded", v.replace(/\D/g, "").slice(0,4))} placeholder="e.g. 1896" />
              <FundField label="Description" value={form.blurb} onChange={v => up("blurb", v)} placeholder="One sentence: what they make, and how" area />
              <FundImage
                label="Photograph"
                name={form.imageName}
                url={form.imageUrl}
                onPick={(file) => {
                  if (!file) return;
                  if (form.imageUrl) URL.revokeObjectURL(form.imageUrl);
                  setForm(f => ({ ...f, imageName: file.name, imageUrl: URL.createObjectURL(file) }));
                }}
                onClear={() => {
                  if (form.imageUrl) URL.revokeObjectURL(form.imageUrl);
                  setForm(f => ({ ...f, imageName: "", imageUrl: "" }));
                }}
              />
              <FundField label="Your email *" value={form.email} onChange={v => up("email", v)} placeholder="For the audit trail" />
            </div>
            <div style={{ borderTop: `1px solid ${FUND.line}`, padding: "12px 22px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 12, color: FUND.muted }}>{ready ? "Ready to submit" : "[*Name, place, country, material, and email required]"}</span>
              <button
                onClick={() => ready && setSent(true)}
                style={{ background: "transparent", border: "none", padding: 0, cursor: ready ? "pointer" : "not-allowed", fontFamily: "inherit", fontSize: 15, color: ready ? FUND.ink : FUND.muted, textDecoration: ready ? "underline" : "none", textUnderlineOffset: 3 }}
              >

  );
}

      <div style={{ padding: "13px 22px 13px 0", fontSize: 14, lineHeight: 1.6 }}>
        {options.map((o, i) => (
          <span key={o}>
            <button onClick={() => onChange(value === o ? "" : o)}
              style={{ background: "transparent", border: "none", padding: 0, cursor: "pointer", fontFamily: "inherit", fontSize: 14, color: value === o ? FUND.ink : FUND.muted, textDecoration: value === o ? "underline" : "none", textUnderlineOffset: 3, textTransform: "capitalize" }}>
              {o}
            </button>
            {i < options.length - 1 && <span style={{ color: FUND.muted }}>, </span>}
          </span>
        ))}
      </div>
    </div>
  );
}

function FundImage({ label, name, url, onPick, onClear }) {
  const ref = React.useRef(null);
  return (
    <div style={{ display: "grid", gridTemplateColumns: "0.8fr 1.2fr", borderBottom: `1px solid ${FUND.hairline}`, alignItems: "center", minHeight: 44 }}>
      <div style={{ padding: "13px 0 13px 22px", fontSize: 14, color: FUND.ink }}>{label}</div>
      <div style={{ padding: "10px 22px 10px 0", fontSize: 14, display: "flex", alignItems: "center", gap: 12 }}>
        <input ref={ref} type="file" accept="image/*" onChange={e => onPick(e.target.files && e.target.files[0])} style={{ display: "none" }} />
        {url && <div style={{ width: 46, height: 34, background: `#eee url(${url}) center/cover no-repeat`, flexShrink: 0 }} />}
        <button onClick={() => ref.current && ref.current.click()}
          style={{ background: "transparent", border: "none", padding: 0, cursor: "pointer", fontFamily: "inherit", fontSize: 14, color: FUND.ink, textDecoration: "underline", textUnderlineOffset: 3, flexShrink: 0 }}>
          {name ? "Replace" : "Choose a file"}
        </button>
        <span style={{ color: FUND.muted, fontSize: 13, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
          {name || "Of the material or the workshop"}
        </span>
        {name && (
          <button onClick={onClear} style={{ background: "transparent", border: "none", padding: 0, cursor: "pointer", fontFamily: "inherit", fontSize: 13, color: FUND.muted, marginLeft: "auto", flexShrink: 0 }}>✕</button>
        )}
      </div>
    </div>
  );
}

Object.assign(window, { FundSubmit, FundField, FundPick, FundImage });
</script>
<script type="text/babel" data-source="components/app.jsx">
const { useState: useStateApp, useEffect: useEffectApp, useMemo: useMemoApp } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showMap": true,
  "variant": "A"
}/*EDITMODE-END*/;

function App() {
  const [screen, setScreen] = useStateApp(() => localStorage.getItem("emr_screen") || "landing");
  const [query, setQuery] = useStateApp("");
  const [filters, setFilters] = useStateApp({ material: "all", scale: "all" });
  const [hover, setHover] = useStateApp(null);
  const [selected, setSelected] = useStateApp(null);
  const [view, setView] = useStateApp("list"); // list | map
  const [lang, setLang] = useStateApp("EN");
  const [tweaks, setTweaks] = useStateApp(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useStateApp(false);

  useEffectApp(() => { localStorage.setItem("emr_screen", screen); }, [screen]);

  useEffectApp(() => {
    function handler(e) {
      if (e.data?.type === "__activate_edit_mode") setTweaksOpen(true);
      if (e.data?.type === "__deactivate_edit_mode") setTweaksOpen(false);
    }
    window.addEventListener("message", handler);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", handler);
  }, []);

  function updateTweak(k, v) {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*");
  }

  const entries = window.REGISTRY;
  const filtered = useMemoApp(() => filterEntries(entries, query, filters), [entries, query, filters]);

  const variantClass = tweaks.variant === "B" ? "variant-b" : "";

  return (
    <div className={`${variantClass}`} style={{ minHeight: "100vh", position: "relative", background: "#fff" }} data-screen-label={`EMR / ${screen}`}>
      <FundNav screen={screen} setScreen={setScreen} />

      {screen === "landing" && <FundLanding setScreen={setScreen} registry={entries} onSelect={setSelected} />}

      {screen === "registry" && (
        <FundRegistry
          filtered={filtered} total={entries.length}
          query={query} setQuery={setQuery}
          filters={filters} setFilters={setFilters}
          hover={hover} setHover={setHover}
          selected={selected} setSelected={setSelected}
          showGrid={tweaks.showMap}
        />
      )}

      {screen === "map" && (
        <FundGeography
          entries={entries} filtered={filtered}
          query={query} setQuery={setQuery}
          filters={filters} setFilters={setFilters}
          hover={hover} setHover={setHover}
          selected={selected} setSelected={setSelected}
        />
      )}

      {screen === "submit" && <FundSubmit setScreen={setScreen} registry={entries} showGrid={tweaks.showMap} onSelect={setSelected} />}

      <FundDetail entry={selected} onClose={() => setSelected(null)} setScreen={setScreen} backLabel={screen === "submit" ? "Back to submit a maker" : screen === "landing" ? "Back to the registry" : null} />

      {tweaksOpen && (
        <div style={{ position: "fixed", right: 18, bottom: 18, zIndex: 90, background: "#fff", color: "#111", border: "1px solid #111", padding: "7px 10px", fontFamily: "'Helvetica Neue', Helvetica, Arial, sans-serif", fontSize: 12, display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ color: "#6b6b6b" }}>Side gallery</span>
          <button
            onClick={() => updateTweak("showMap", !tweaks.showMap)}
            style={{ width: 26, height: 14, border: "1px solid #111", background: tweaks.showMap ? "#111" : "transparent", position: "relative", cursor: "pointer", padding: 0 }}
          >
            <span style={{ position: "absolute", top: 1, left: tweaks.showMap ? 13 : 1, width: 10, height: 10, background: tweaks.showMap ? "#fff" : "#111", transition: "left 120ms" }} />
          </button>
        </div>
      )}
    </div>
  );
}

function TopNav({ screen, setScreen, lang, setLang }) {
  const items = [
    { id: "landing", label: "Atlas" },
    { id: "registry", label: "Index" },
    { id: "map", label: "Map" },
    { id: "submit", label: "Submit" },
  ];
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "stretch", borderBottom: "1px solid var(--line)", background: "var(--paper)", position: "sticky", top: 0, zIndex: 50 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "0 16px", borderRight: "1px solid var(--line)" }}>
        <button onClick={() => setScreen("landing")} style={{ background: "transparent", border: "none", padding: 0, cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ display: "inline-block", width: 14, height: 14, background: "var(--ink)", transform: "rotate(45deg)" }} />
          <span className="mono" style={{ fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase" }}>EMR · European Material Registry</span>
        </button>
      </div>
      <div style={{ display: "flex" }}>
        {items.map((it) => (
          <button key={it.id} onClick={() => setScreen(it.id)}
            style={{
              padding: "10px 18px", borderLeft: "1px solid var(--line)", background: screen === it.id ? "var(--ink)" : "transparent",
              color: screen === it.id ? "var(--bone)" : "var(--ink)", border: "none", borderLeft: "1px solid var(--line)",
              fontFamily: "'Helvetica Neue', Helvetica, Arial, sans-serif", fontWeight: 500, fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", cursor: "pointer"
            }}>
            {it.label}
          </button>
        ))}
        <div style={{ borderLeft: "1px solid var(--line)", padding: "6px 10px", display: "flex", alignItems: "center" }}>
          <LangSwitcher lang={lang} setLang={setLang} />
        </div>
      </div>
    </div>
  );
}

function RegistryScreen({ filtered, total, query, setQuery, filters, setFilters, view, setView, hover, setHover, selected, setSelected, showMap }) {
  return (
    <div style={{ display: "grid", gridTemplateColumns: showMap && view === "list" ? "1fr 420px" : "1fr", gap: 0, height: "calc(100vh - 42px)" }}>
      <div style={{ borderRight: showMap && view === "list" ? "1px solid var(--line)" : "none", display: "flex", flexDirection: "column", overflow: "hidden" }}>
        <div style={{ padding: "20px 24px", borderBottom: "1px solid var(--line)", display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
          <div>
            <div className="mono" style={{ fontSize: 10, letterSpacing: "0.16em", marginBottom: 4 }}>ATLAS / VOL.03</div>
            <h2 style={{ fontSize: 38, fontWeight: 500, letterSpacing: "-0.02em", margin: 0, lineHeight: 1.1, paddingBottom: 4 }}>
              The Index
            </h2>
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            <button className={`pill ${view === "list" ? "active" : ""}`} onClick={() => setView("list")}>List</button>
            <button className={`pill ${view === "map" ? "active" : ""}`} onClick={() => setView("map")}>Map</button>
          </div>
        </div>

        <FilterBar
          filters={filters} setFilters={setFilters}
          query={query} setQuery={setQuery}
          results={filtered.length} total={total}
        />

        <div style={{ flex: 1, overflowY: "auto", position: "relative" }}>
          {view === "list" ? (
            <>
              <RegistryHeaderRow />
              {filtered.map((e, i) => (
                <RegistryRow
                  key={e.id} entry={e} index={i}
                  onHover={setHover}
                  onSelect={setSelected}
                  selected={selected?.id === e.id}
                />
              ))}
              {filtered.length === 0 && (
                <div style={{ padding: 60, textAlign: "center" }}>
                  <div className="mono" style={{ fontSize: 11, letterSpacing: "0.16em", opacity: 0.6 }}>NO ENTRIES MATCH THESE PARAMETERS</div>
                </div>
              )}
            </>
          ) : (
            <div style={{ height: "100%" }}>
              <MapView entries={filtered} onSelect={setSelected} hover={hover} setHover={setHover} selected={selected} />
            </div>
          )}
        </div>
      </div>

      {showMap && view === "list" && (
        <div style={{ display: "flex", flexDirection: "column", borderLeft: "1px solid var(--line)" }}>
          <div style={{ padding: "14px 16px", borderBottom: "1px solid var(--line)", display: "flex", justifyContent: "space-between" }}>
            <span className="mono" style={{ fontSize: 10, letterSpacing: "0.16em" }}>LIVE MAP · HOVER TO LOCATE</span>
            <span className="mono" style={{ fontSize: 10, letterSpacing: "0.1em", opacity: 0.6 }}>{filtered.length} PINS</span>
          </div>
          <div style={{ flex: 1, position: "relative" }}>
            <MapView entries={filtered} onSelect={setSelected} hover={hover} setHover={setHover} selected={selected} />
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
