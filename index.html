<!-- Per-entry images (override the material default) -->

<script>
  window.__logo = function() {
    return (window.__resources && window.__resources.emrLogo) || "images/logo.png";
  };
  window.__matImg = function(mat) {
    var map = {
      steel: "matSteel", ceramic: "matCeramic", glass: "matGlass",
      wool: "matWool", wood: "matWood", stone: "matStone", paper: "matPaper"
    };
    var id = map[mat];
    var files = { steel: "images/steel-pillow.jpg", glass: "images/glass-leaded.jpg", wood: "images/wood-ancient.jpg" };
    return (window.__resources && id && window.__resources[id]) || files[mat] || ("images/" + mat + ".jpg");
  };
  // Per-entry image. If entry.image is set (a path like
  // "images/wool-icelandic-fleece.jpg", or a resource id), prefer that.
  // Otherwise fall back to the material default.
  window.__entryImg = function(entry) {
    if (!entry) return "";
    if (entry.image) {
      // Allow either a resource id (window.__resources lookup) or a direct path
      if (window.__resources && window.__resources[entry.image]) return window.__resources[entry.image];
      return entry.image;
    }
    return window.__matImg(entry.material);
  };
  // A second, different photograph for the same maker — drawn from the other
  // images held for that material. Returns "" when the material has only one,
  // so the detail view shows a single full-height image instead of a repeat.
  window.__MAT_POOL = {
    steel:   ["images/steel-plate.jpg", "images/steel-studded.jpg", "images/steel-embossed.jpg", "images/steel-pillow.jpg"],
    ceramic: ["images/ceramic-sunforms.jpg", "images/ceramic-blancdechine.jpg", "images/ceramic.jpg", "images/ceramic-suntiles.jpg", "images/ceramic-plates.jpg", "images/ceramic-mosaic.jpg", "images/ceramic-relief.jpg", "images/ceramic-manganese.jpg", "images/ceramic-platters.jpg", "images/ceramic-crystalline.jpg", "images/ceramic-lustre.jpg", "images/ceramic-moonjars.jpg", "images/ceramic-throwing-large.jpg", "images/ceramic-throwing-small.jpg", "images/ceramic-wheel-finishing.jpg", "images/ceramic-handbuilding.jpg", "images/ceramic-brushes.jpg", "images/ceramic-greenware.jpg", "images/ceramic-studio.jpg", "images/ceramic-tools.jpg"],
    wool:    ["images/wool-icelandic-fleece.jpg", "images/wool.jpg", "images/wool-gotland-fleece.jpg", "images/wool-drying.jpg", "images/wool-fleece.jpg", "images/wool-nuno.jpg", "images/wool-store.jpg", "images/wool-felt-a.jpg", "images/wool-felt-b.jpg", "images/wool-lace.jpg"],
    glass:   ["images/glass-torchwork.jpg", "images/glass-reeded.jpg", "images/glass-leaded.jpg", "images/glass-block.jpg", "images/glass-bubbled.jpg"],
    stone:   ["images/stone-brac-limestone.avif", "images/stone-marble-veined.jpg", "images/stone.jpg", "images/stone-quarry.jpg", "images/stone-granite.jpg", "images/stone-limestone.jpg", "images/stone-slate.jpg", "images/stone-grinding.jpg", "images/stone-basalt.jpg", "images/stone-iceland.avif"],
    wood:    ["images/wood-ancient.jpg", "images/wood-birch-grain.jpg", "images/wood.jpg", "images/wood-burr.jpg", "images/wood-construction.jpg", "images/wood-joinery.jpg", "images/wood-stabilised.jpg"],
    paper:   ["images/paper.jpg", "images/paper-pad.jpg", "images/paper-drying.jpg", "images/paper-tinted.jpg", "images/paper-newsprint.jpg"]
  };
  window.__resolveImg = function(path) {
    if (window.__resources && window.__resources[path]) return window.__resources[path];
    var mats = { steel: "matSteel", ceramic: "matCeramic", glass: "matGlass", wool: "matWool", wood: "matWood", stone: "matStone", paper: "matPaper" };
    for (var m in mats) {
      var def = window.__MAT_POOL[m] && window.__MAT_POOL[m][0];
      if (def === path && window.__resources && window.__resources[mats[m]]) return window.__resources[mats[m]];
    }
    return path;
  };
  // Photographs that show work happening — a site, a hand, a drying rack —
  // rather than the material on its own. The detail view's second frame prefers
  // these, so the tile shows the material and the detail shows the making.
  window.__PROCESS_IMGS = [
    "images/stone-grinding.jpg", "images/stone-brac-quarry.avif",
    "images/paper-drying.jpg", "images/wool-drying.jpg", "images/wool-store.jpg",
    "images/ceramic-throwing-large.jpg", "images/ceramic-throwing-small.jpg",
    "images/ceramic-wheel-finishing.jpg", "images/ceramic-handbuilding.jpg",
    "images/ceramic-brushes.jpg", "images/ceramic-greenware.jpg",
    "images/ceramic-studio.jpg", "images/ceramic-tools.jpg", "images/kaolin-lumps.jpg", "images/brick-handmoulded.jpg", "images/brick-green-drying.jpg",
    "images/wood-construction.jpg", "images/wood-joinery.jpg", "images/wood-stabilised.jpg",
    "images/kaolin-heap.jpg"
  ];
  window.__entryImg2 = function(entry) {
    if (!entry) return "";
    // An entry may name its own process photograph, which is always preferred:
    // matching a specific making process beats anything chosen by rotation.
    if (entry.image2) {
      if (window.__resources && window.__resources[entry.image2]) return window.__resources[entry.image2];
      return entry.image2;
    }
    var pool = window.__MAT_POOL[entry.material] || [];
    if (pool.length < 2) return "";
    var primary = window.__entryImg(entry);
    // stable offset per entry so different makers pair differently
    var seed = 0, id = entry.id || "";
    for (var i = 0; i < id.length; i++) seed += id.charCodeAt(i);
    var pass, k, raw, cand;
    // first pass: a process photograph; second pass: any other image
    for (pass = 0; pass < 2; pass++) {
      for (k = 0; k < pool.length; k++) {
        raw = pool[(seed + k) % pool.length];
        if (pass === 0 && window.__PROCESS_IMGS.indexOf(raw) === -1) continue;
        cand = window.__resolveImg(raw);
        if (cand !== primary) return cand;
      }
    }
    return "";
  };

// place these colours are set.

      center: [54, 10],
      zoom: 4,
      zoomControl: false,
      attributionControl: true,
      worldCopyJump: false,

      // panel — fitBounds got clamped and Iceland and Malta fell off the edge.
      // Fractional snapping lets the fit land exactly rather than rounding to
      // the next power of two.

    // the parse cheap; it omits small islands, so the ones the registry needs
    // are drawn from ISLANDS below.

      .then(r => r.json())
      .then(topo => {
        if (!mapRef.current) return;

        // the raw coordinates: building a throwaway L.geoJSON per feature would
        // parse and render the whole world (Russia, Canada, Antarctica) at 50m
        // resolution before anything appeared.
        const bbox = (geom) => {
          let w = 180, e = -180, s = 90, n = -90;
          const walk = (c) => {
            if (typeof c[0] === "number") {
              if (c[0] < w) w = c[0];
              if (c[0] > e) e = c[0];
              if (c[1] < s) s = c[1];
              if (c[1] > n) n = c[1];
              return;
            }
            for (let i = 0; i < c.length; i++) walk(c[i]);
          };
          if (!geom || !geom.coordinates) return null;
          walk(geom.coordinates);
          return e < w ? null : { w, e, s, n };
        };
        const inFrame = (f) => {
          const b = bbox(f.geometry);
          if (!b) return false;
          // Rings that wrap the antimeridian report an absurd span and fill as
          // slabs at this projection — drop them.

        // assembled into one collection.

        for (let i = 0; i < geoms.length; i++) {
          const f = topojson.feature(topo, geoms[i]);
          if (inFrame(f)) features.push(f);
        }
        // Islands the 110m set drops, several of which hold makers — Gotland,
        // Bornholm, Shetland, the Outer Hebrides, Saaremaa, Gozo — so their pins
        // sit on land rather than open water.
        const ISLANDS = {
          Gotland: [[57.95,18.75],[57.60,18.98],[57.25,18.72],[57.03,18.20],[57.35,18.10],[57.72,18.30]],
          Bornholm: [[55.30,14.68],[55.13,15.15],[54.99,15.08],[55.00,14.70],[55.15,14.66]],
          Shetland: [[60.85,-0.88],[60.60,-0.95],[60.15,-1.10],[59.87,-1.28],[60.15,-1.45],[60.60,-1.35]],
          Hebrides: [[58.52,-6.20],[58.20,-6.20],[57.75,-6.85],[57.90,-7.15],[58.25,-6.95],[58.50,-6.60]],
          Saaremaa: [[58.60,22.10],[58.50,23.00],[58.20,23.00],[57.92,22.05],[58.25,21.85]],
          Oland: [[57.37,17.05],[56.95,16.85],[56.20,16.40],[56.45,16.35],[57.10,16.70]],
          Gozo: [[36.09,14.18],[36.05,14.32],[36.01,14.30],[36.02,14.18]],
        };

            type: "Feature",

        const LAND = mapToken("--land", "#eeeeec");
        const BORDER = mapToken("--border", "#dcdcd8");

        const layer = L.geoJSON(fc, {
          pane: "tilePane",
          style: { fillColor: LAND, fillOpacity: 1, color: BORDER, weight: 0.8 },
          interactive: false,
        }).addTo(mapRef.current);

        // Name only the countries that hold makers, so the map stays legible.
        const wanted = new Set(
          Array.from(new Set(window.REGISTRY.map(e => e.country)))
            .map(cc => window.COUNTRY_NAMES[cc])
            .filter(Boolean)
        );
        // Place each label at the area centroid of the country's largest
        // landmass. Averaging raw vertices skews badly where a coastline is
        // finely detailed.
        const biggestRing = (geom) => {
          const polys = geom.type === "Polygon" ? [geom.coordinates] : geom.coordinates;
          let best = null, bestArea = -1;
          polys.forEach(p => {
            const ring = p[0];
            let a = 0;
            for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
              a += ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1];
            }
            a = Math.abs(a / 2);
            if (a > bestArea) { bestArea = a; best = ring; }
          });
          if (!best) return null;
          let cx = 0, cy = 0, signed = 0;
          for (let i = 0, j = best.length - 1; i < best.length; j = i++) {
            const cross = best[j][0] * best[i][1] - best[i][0] * best[j][1];
            signed += cross;
            cx += (best[j][0] + best[i][0]) * cross;
            cy += (best[j][1] + best[i][1]) * cross;
          }

          return { at: [cy / (3 * signed), cx / (3 * signed)], area: bestArea };
        };

        // mainland centroid sits close to the Swedish border, and Portugal's
        // name is squeezed by Spain's. Anchor those by hand.
        const anchors = {
          "Norway": [62.8, 7.4],
          "Sweden": [60.2, 14.4],
          "Portugal": [40.9, -9.9],
          "Spain": [39.9, -4.2],
          "Italy": [43.0, 12.4],
          "Greece": [39.3, 22.2],
          "Denmark": [56.2, 9.2],
          "Finland": [63.6, 26.8],
          "United Kingdom": [53.4, -2.2],
          "Ireland": [53.3, -8.6],
          "Croatia": [45.2, 16.4],
        };

        // importance, which beats raw polygon area for deciding what to name.
        const weight = {};
        window.REGISTRY.forEach(e => {
          const n = window.COUNTRY_NAMES[e.country];
          if (n) weight[n] = (weight[n] || 0) + 1;
        });
        layer.eachLayer(l => {
          const name = l.feature && l.feature.properties && l.feature.properties.name;
          if (!name || l.feature.properties.synthetic || !wanted.has(name)) return;

          if (!r) return;

            interactive: false,
            keyboard: false,

          // orient, so they keep their names when central Europe runs out of
          // room. Maker count breaks ties between similar-sized neighbours.
          labels.push({ mk, bb, area: r.area, rank: r.area + (weight[name] || 0) * 2 });

        // clusters resolve themselves as the reader moves in.

          a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;

        // computed arithmetically from that size — writing a margin and reading

        const syncLabels = () => {
          const map = mapRef.current;
          if (!map) return;
          const pins = [];
          window.REGISTRY.forEach(e => {
            const c = window.COORDS[e.place];
            if (!c) return;

            const el = mk.getElement();
            if (!el) return;

            // collapse every candidate box onto the anchor and stack the names.

            // zoom — the word ends up over a neighbour — so they wait for the
            // reader to come closer.

            // that travels further reads as naming the country next door, which
            // is worse than a name touching a pin.
            const reach = Math.max(11, Math.min(16, h + 3));
            const shift = [];
            for (const d of dirs) {
              if (d[0] === 0 && d[1] === 0) { shift.push([0, 0]); continue; }
              shift.push([Math.round(d[0] * reach * 0.6), Math.round(d[1] * reach * 0.6)]);
            }
            for (const d of dirs) {
              if (d[0] === 0 && d[1] === 0) continue;
              shift.push([Math.round(d[0] * reach), Math.round(d[1] * reach)]);

            // a preference, since pin density in central Europe would otherwise
            // push names onto their neighbours.

              // label is centred through its own margins.

              if (pins.some(q => overlaps(box, q))) continue;

              break;
            }

            if (!use) { el.style.display = "none"; return; }

            el.style.marginTop = use.dy + "px";

        };

    mapRef.current = map;
    map.attributionControl.addAttribution("Geometry: Natural Earth");

    // leave Leaflet with a 0x0 viewport. Invalidate on the next frame, and
    // again whenever the panel resizes.
    //
    // A resize also has to re-fit the view. The panel is beside the list on a
    // wide screen and below it on a narrow one, and a view framed for one
    // shape spills Europe out of the other. Re-fitting stops once the reader
    // has zoomed or panned, so their own view is never yanked back.
    // Frame on the entries themselves rather than a fixed box. A hardcoded
    // box was clipping Iceland, whose pins sit at -22° — west of any sensible
    // guess at where Europe ends.
    const lats = [], lngs = [];
    Object.keys(window.COORDS).forEach(k => {
      const c = window.COORDS[k];
      if (c) { lats.push(c[0]); lngs.push(c[1]); }
    });

      ? [[Math.min(...lats) - 1.5, Math.min(...lngs) - 1.5],
         [Math.max(...lats) + 1.5, Math.max(...lngs) + 1.5]]
      : [[35, -24], [67, 34]];

    const fit = () => map.fitBounds(BOUNDS, { animate: false, padding: [14, 14] });
    const sync = () => {
      const m = mapRef.current;
      if (!m) return;
      m.invalidateSize();
      const w = host.clientWidth, h = host.clientHeight;
      if (w === 0 || h === 0) return;
      const reshaped = Math.abs(w - lastW) > 2 || Math.abs(h - lastH) > 2;
      lastW = w; lastH = h;
      if (!framed || (reshaped && !touched)) { framed = true; fit(); }
    };

    // detected from the input instead: a wheel, or a pointer on the canvas
    // (which covers dragging the map and pressing the zoom control).

    host.addEventListener("pointerdown", markTouched);

    const raf2 = requestAnimationFrame(() => requestAnimationFrame(sync));

    ro.observe(host);

      cancelAnimationFrame(raf1); cancelAnimationFrame(raf2); clearTimeout(t);
      ro.disconnect();
      host.removeEventListener("wheel", markTouched);
      host.removeEventListener("pointerdown", markTouched);
      map.remove(); mapRef.current = null;
    };
  }, []);

  React.useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    Object.values(markersRef.current).forEach(m => m.remove());
    markersRef.current = {};
    entries.forEach(e => {
      const ll = window.COORDS[e.place];
      if (!ll) return;
      const m = L.circleMarker([ll[0], ll[1]], {
        radius: 5,
        color: mapToken("--paper", "#ffffff"),
        weight: 1.5,
        fillColor: mapToken("--ink", "#111111"),
        fillOpacity: 1,
      }).addTo(map);
      m.on("mouseover", () => cbRef.current.setHover(e));
      m.on("mouseout", () => cbRef.current.setHover(null));
      m.on("click", () => cbRef.current.onSelect(e));
      markersRef.current[e.id] = m;
    });
  }, [entries]);

  // Reflect hover / selection in pin size
  React.useEffect(() => {
    const hotId = hover?.id || selected?.id;
    Object.entries(markersRef.current).forEach(([id, m]) => {
      const hot = id === hotId;
      // Hover reads as size and ring weight, not colour, so the pin stays the
      // same ink at every state.
      m.setStyle({ weight: hot ? 3 : 1.5 });
      m.setRadius(hot ? 8 : 5);
    });

  return (
    <div style={{ position: "absolute", inset: 0, background: "var(--paper)" }}>
      <div ref={hostRef} className="emr-map" style={{ position: "absolute", inset: 0 }} />
    </div>
  );
}

Object.assign(window, { MapView });

<script type="text/babel">
/* ==========================================================================
   SHARED — palette, logo, navigation, the Index, gallery tiles
   source: components/fund.jsx
   ========================================================================== */

// Rows matching the current search text and material filter. The search looks
// at every field a reader might type, so "mouth-blown", "Bohemia" and "Nový"
// all find the same maker.
function filterEntries(entries, query, filters) {
  const q = query.trim().toLowerCase();
  return entries.filter(e => {
    if (filters.material !== "all" && e.material !== filters.material) return false;
    if (filters.scale !== "all" && e.scale !== filters.scale) return false;
    if (!q) return true;
    const haystack = [e.name, e.place, e.country, e.region, e.material, e.process, e.blurb]
      .join(" ").toLowerCase();
    return haystack.includes(q);
  });
}

// Minimal utilitarian interface: white paper, black ink, a dark canvas behind
// the photographs.
//
// FUND is the palette every component reads. Each value points at a token in
// styles.css, so a colour is changed in one place and both the stylesheet and
// these inline styles follow. Put a literal hex here only for something the
// stylesheet has no opinion about.
const FUND = {
  paper:    "var(--paper)",
  ink:      "var(--ink)",
  line:     "var(--ink)",
  muted:    "var(--muted)",
  canvas:   "var(--canvas)",
  hairline: "var(--hairline)",
  hover:    "var(--hover)",
};

// The registry's mark: eleven of the twelve European stars on a shallow tilted
// ellipse, with one withheld at the upper left. Drawn rather than loaded as an
// image so it stays crisp at any size and takes the surrounding text colour.
//
// The stars are all one size deliberately. A circle of equal objects seen at an
// angle projects to evenly-spaced points on an ellipse with no change in scale
// — varying their size implies a much nearer viewpoint, and past a slight
// difference it stops reading as depth and starts reading as stars of
// different sizes.
function EMRMark({ size = 20 }) {
  const RY = 0.5, TILT = -22 * Math.PI / 180, SR = 0.13, GAP = 11;
  const pts = [];
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6 - Math.PI / 2;
    const px = Math.cos(a), py = RY * Math.sin(a);
    pts.push({
      x: px * Math.cos(TILT) - py * Math.sin(TILT),
      y: px * Math.sin(TILT) + py * Math.cos(TILT),
    });
  }
  // Framed on the complete ring, so withholding a star does not shift the mark.
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  pts.forEach(q => {
    x0 = Math.min(x0, q.x - SR); x1 = Math.max(x1, q.x + SR);
    y0 = Math.min(y0, q.y - SR); y1 = Math.max(y1, q.y + SR);
  });
  const k = Math.min(90 / (x1 - x0), 90 / (y1 - y0));
  const ox = 48 - ((x0 + x1) / 2) * k, oy = 48 - ((y0 + y1) / 2) * k;
  const R = SR * k;
  const d = pts.filter((q, i) => i !== GAP).map(q => {
    const cx = q.x * k + ox, cy = q.y * k + oy;
    let p = "";
    for (let j = 0; j < 10; j++) {
      const rr = j % 2 ? R * 0.382 : R, a = (j / 10) * Math.PI * 2 - Math.PI / 2;
      p += (j ? "L" : "M") + (cx + Math.cos(a) * rr).toFixed(2) + "," + (cy + Math.sin(a) * rr).toFixed(2);
    }
    return p + "Z";
  }).join("");
  return (
    <svg viewBox="0 0 96 96" width={size} height={size} fill="currentColor" aria-hidden="true" style={{ display: "block", flex: "none" }}>
      <path d={d}></path>
    </svg>
  );
}

// Flat top navigation — thin underline row
function FundNav({ screen, setScreen }) {
  const items = [
    { id: "landing", label: "Atlas" },
    { id: "registry", label: "Index" },
    { id: "map", label: "Geography" },
    { id: "submit", label: "Submit a maker" },
  ];
  return (
    <div style={{ background: FUND.paper, borderBottom: `1px solid ${FUND.line}`, fontFamily: "'Helvetica Neue', Helvetica, Arial, sans-serif", position: "sticky", top: 0, zIndex: 50 }}>
      <div className="emr-nav" style={{ display: "grid", gridTemplateColumns: "1fr auto 1fr", padding: "14px 22px", alignItems: "center", fontSize: 15 }}>
        <button onClick={() => setScreen("landing")} style={{ background: "transparent", border: "none", padding: 0, textAlign: "left", cursor: "pointer", fontSize: 15, color: FUND.ink, display: "flex", alignItems: "center", gap: 6, fontFamily: "inherit" }}>
          <img src={window.__logo()} alt="" style={{ height: 20, width: "auto", display: "block", flex: "none", transform: "scaleX(-1)" }} />
          European Material Registry
        </button>
        <div style={{ display: "flex", gap: 36, justifyContent: "center" }}>
          {items.slice(1, 3).map(it => (
            <button key={it.id} onClick={() => setScreen(it.id)}
              style={{ background: "transparent", border: "none", padding: 0, cursor: "pointer", fontSize: 15, color: FUND.ink, textDecoration: screen === it.id ? "underline" : "none", textUnderlineOffset: 4 }}>
              {it.label}
            </button>
          ))}
        </div>
        <div style={{ textAlign: "right" }}>
          <button onClick={() => setScreen("submit")} style={{ background: "transparent", border: "none", padding: 0, cursor: "pointer", fontSize: 15, color: FUND.ink, textDecoration: screen === "submit" ? "underline" : "none", textUnderlineOffset: 4 }}>
            Submit a maker
          </button>
        </div>
      </div>
    </div>
  );
}

// Registry screen — left table of entries, right dark visual grid
function FundRegistry({ filtered, total, query, setQuery, filters, setFilters, selected, setSelected, hover, setHover, showGrid }) {
  const allMats = ["all","steel","ceramic","glass","wool","wood","stone","paper"];

  // Build the filter-as-sentence: "All, Ceramic, Textile, ..."
  function toggleMat(m) {
    setFilters(f => ({ ...f, material: f.material === m ? "all" : m }));
  }

  return (
    <div className="emr-split emr-split-index" style={{ display: "grid", gridTemplateColumns: showGrid ? "minmax(480px, 1fr) 1.3fr" : "1fr", height: "calc(100vh - 51px)", fontFamily: "'Helvetica Neue', Helvetica, Arial, sans-serif", background: FUND.paper }}>
      {/* LEFT: dense table */}
      <div className="emr-index-col" style={{ display: "flex", flexDirection: "column", borderRight: showGrid ? `1px solid ${FUND.line}` : "none", overflow: "hidden" }}>
        {/* Search bar */}
        <div className="emr-index-search" style={{ borderBottom: `1px solid ${FUND.line}`, padding: "10px 22px" }}>
          <input
            value={query}
            onChange={e => setQuery(e.target.value)}
            placeholder="Search place, maker, material…"
            style={{ width: "100%", border: "none", outline: "none", background: "transparent", fontSize: 15, fontFamily: "inherit", padding: "4px 0" }}
          />
        </div>
        {/* Filter sentence */}
        <div className="emr-index-filters" style={{ borderBottom: `1px solid ${FUND.line}`, padding: "10px 22px", fontSize: 14, lineHeight: 1.5 }}>
          {allMats.map((m, i) => (
            <span key={m}>
              <button
                onClick={() => toggleMat(m)}
                style={{
                  background: "transparent",
                  border: "none",
                  padding: 0,
                  cursor: "pointer",
                  fontFamily: "inherit",
                  fontSize: 14,
                  color: FUND.ink,
                  textDecoration: (filters.material === m || (m === "all" && filters.material === "all")) ? "underline" : "none",
                  textUnderlineOffset: 3,
                  textTransform: m === "all" ? "capitalize" : "capitalize",
                }}
              >
                {m === "all" ? "All" : m.charAt(0).toUpperCase() + m.slice(1)}
              </button>
              {i < allMats.length - 1 && <span style={{ color: FUND.ink }}>, </span>}
            </span>
          ))}
          <span style={{ float: "right", color: FUND.muted, fontSize: 13 }}>{filtered.length} / {total}</span>
        </div>

        {/* Table rows */}
        <div className="emr-index-rows" style={{ flex: 1, overflowY: "auto" }}>
          {filtered.map(e => (
            <FundRow key={e.id} entry={e} onSelect={setSelected} onHover={setHover} selected={selected?.id === e.id} hovered={hover?.id === e.id} />
          ))}
          {filtered.length === 0 && (
            <div style={{ padding: "40px 22px", color: FUND.muted, fontSize: 13 }}>No entries match these filters.</div>
          )}

        {/* Footer */}
        <div className="emr-index-foot" style={{ borderTop: `1px solid ${FUND.line}`, padding: "10px 22px", display: "flex", justifyContent: "space-between", fontSize: 12, color: FUND.muted }}>
          <span>© 2026 EMR</span>
          <span>registry@emr.eu</span>
        </div>
      </div>

      {/* RIGHT: dark gallery grid */}
      {showGrid && (
        <div className="emr-index-gallery" style={{ background: FUND.canvas, overflowY: "auto", padding: 22 }}>
          <FundGallery entries={filtered} onSelect={setSelected} hover={hover} />
        </div>
      )}
    </div>
  );
}

// A single table row: name | material tags
function FundRow({ entry, onSelect, onHover, selected, hovered }) {
  return (
    <div
      onMouseEnter={() => onHover(entry)}
      onMouseLeave={() => onHover(null)}
      onClick={() => onSelect(entry)}
      style={{
        display: "grid",
        gridTemplateColumns: "1.2fr 1.2fr",
        borderBottom: `1px solid ${FUND.line}`,
        padding: "12px 22px",
        cursor: "pointer",
        background: selected || hovered ? FUND.hover : "transparent",
        fontSize: 14,
        alignItems: "center",
        minHeight: 44,
      }}
    >
      <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
        <span style={{ color: FUND.ink, fontWeight: 400 }}>{entry.name}</span>
        <span style={{ color: FUND.muted, fontSize: 12 }}>{entry.place}, {window.COUNTRY_NAMES[entry.country]}</span>
      </div>
      <div style={{ color: FUND.ink, textTransform: "capitalize" }}>
        {entry.material}{entry.scale !== "industrial" ? `, ${entry.scale}` : ""}
      </div>
    </div>
  );
}

// Gallery. The viewer occupies one column and two rows on the left, so the
// ordinary tiles flow around it — two stacked beside it, then the rest in both
// columns. Its height is set by the two 4:3 tiles it sits against, which keeps
// it a constant size while the cursor moves down the index.
//
// The grid holds every entry and never reorders. Promoting the hovered entry
// out of the grid, as this once did, meant each hover removed a tile and
// reshuffled the thirty below it.
// Gallery. The first entry holds the viewer permanently — it sits there
// underneath, is replaced while another maker is hovered, and returns when the
// cursor leaves. Because it lives in the viewer it is left out of the grid
// below, so nothing appears twice.
//
// The grid's membership is therefore fixed. An earlier version promoted the
// hovered entry out of the grid, which meant every hover removed a tile and
// reshuffled the thirty below it.
function FundGallery({ entries, onSelect, hover, limit }) {
  const resident = entries[0];
  const featured = hover || resident;
  let rest = entries.slice(1);
  if (limit) rest = rest.slice(0, limit - 1);
  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
      {featured && <FundTile entry={featured} big onClick={() => onSelect(featured)} />}
      {rest.map(e => (
        <FundTile
          key={e.id}
          entry={e}
          active={hover?.id === e.id}
          onClick={() => onSelect(e)}
        />
      ))}
    </div>
  );
}

function FundTile({ entry, big, active, onClick }) {
  const img = window.__entryImg(entry);
  return (
    <div onClick={onClick} style={{
      gridRow: big ? "span 2" : "auto",
      aspectRatio: big ? "auto" : "4 / 3",
      minHeight: big ? 260 : "auto",
      background: `#222 url(${img}) center/cover no-repeat`,
      borderRadius: 2,
      position: "relative",
      overflow: "hidden",
      cursor: "pointer",
      outline: active ? "1px solid rgba(255,255,255,0.55)" : "none",
      outlineOffset: active ? "-1px" : "0",
    }}>
      {big ? (
        <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, padding: "14px 15px", color: "#fff", fontFamily: "'Helvetica Neue', sans-serif", background: "linear-gradient(to top, rgba(0,0,0,0.65), transparent)" }}>
          <div style={{ fontSize: 17, letterSpacing: "-0.01em", lineHeight: 1.2 }}>{entry.name}</div>
          <div style={{ fontSize: 11, marginTop: 4, opacity: 0.85, textTransform: "capitalize", lineHeight: 1.45 }}>
            {entry.material} · {entry.process}<br />{entry.place}, {window.COUNTRY_NAMES[entry.country]} · Est. {entry.founded}
          </div>
        </div>
      ) : (
        <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, padding: "10px 12px", color: "rgba(255,255,255,0.95)", fontSize: 11, fontFamily: "'Helvetica Neue', sans-serif", display: "flex", justifyContent: "space-between", background: "linear-gradient(to top, rgba(0,0,0,0.6), transparent)" }}>
          <span>{entry.place}, {entry.country}</span>
          <span style={{ opacity: 0.75 }}>{entry.id}</span>
        </div>
      )}
    </div>
  );
}

Object.assign(window, { filterEntries, EMRMark, FundNav, FundRegistry, FundRow, FundGallery, FundTile, FUND });
</script>

<script type="text/babel">

          </div>

// Detail panel in Fundament editorial style
function FundDetail({ entry, onClose, backLabel, setScreen }) {
  if (!entry) return null;
  const img = window.__entryImg(entry);
  const img2 = window.__entryImg2(entry);
  const art = /^[aeiou]/i.test(entry.scale) ? "an" : "a";
  // What kind of place this is. The registry indexes quarries, pits, sawmills
  // and rolling mills as well as workshops, so the noun has to come from the
  // entry rather than being assumed.
  const noun = entry.process === "quarried" ? "quarry"
    : entry.process === "extracted" ? "pit"
    : entry.process === "sawn" ? "sawmill"
    : /^(spun|fulled)$/.test(entry.process) ? "mill"
    : entry.material === "paper" ? "mill"
    : entry.scale === "industrial" ? "works"
    : "workshop";
  // Only claim generations where the dates bear it out, and never say a quarry
  // or a clay pit "made" what it yields.
  const age = new Date().getFullYear() - entry.founded;
  const verb = /^(quarried|extracted)$/.test(entry.process) ? "yielded" : "made";

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 100 }}>

          <div style={{ padding: "14px 22px", borderRight: `1px solid ${FUND.line}`, fontVariantNumeric: "tabular-nums" }}>Est. {entry.founded} · Reg. {entry.id}</div>
          <div style={{ padding: "14px 22px", borderRight: `1px solid ${FUND.line}` }}>{entry.place}, {window.COUNTRY_NAMES[entry.country]}</div>
          <button onClick={onClose} className="emr-detail-close" style={{ padding: "0 22px", background: "transparent", border: "none", cursor: "pointer", fontSize: 16, fontFamily: "inherit", color: FUND.ink }}>✕</button>
        </div>

          <div style={{ padding: "10px 22px", color: FUND.ink }}>{entry.name}</div>
          {backLabel && (

          <div style={{ display: "grid", gridTemplateRows: img2 ? "1fr 1fr" : "1fr", borderRight: `1px solid ${FUND.line}` }}>
            <div style={{ background: `#222 url(${img}) center/cover no-repeat`, position: "relative", borderBottom: img2 ? `1px solid ${FUND.line}` : "none", overflow: "hidden" }}>

            </div>
            {img2 && (

                <div style={{ position: "absolute", bottom: 14, left: 16, fontSize: 11, color: "rgba(255,255,255,0.95)", background: "rgba(0,0,0,0.35)", padding: "3px 8px" }}>Process · {entry.process}</div>

              <div style={{ padding: "14px 28px", lineHeight: 1.55 }}>
                {entry.name}<br/>
                {entry.region}, {window.COUNTRY_NAMES[entry.country]}<br/>
                {entry.material} · {entry.process}<br/>
                <span style={{ textTransform: "capitalize" }}>{entry.scale}</span>
              </div>
              <div style={{ padding: "14px 22px", lineHeight: 1.55, fontVariantNumeric: "tabular-nums" }}>
                Lead time<br/>4–12 weeks<br/>Samples on request
              </div>
              <div style={{ padding: "14px 22px", lineHeight: 1.55 }}>
                Registry ref. {entry.id}<br/>Public entry<br/>Last audit 03 / 2026
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { FundLanding, FundDetail });
</script>

<script type="text/babel">

   GEOGRAPHY screen

// Geography screen — Fundament style: left text-list of places, right is map

                {m === "all" ? "All" : m.charAt(0).toUpperCase() + m.slice(1)}

                    <span>{e.place}</span>

                    {e.material} · {e.process}

          {filtered.length === 0 && (
            <div style={{ padding: "40px 22px", color: FUND.muted, fontSize: 13 }}>No entries match these filters.</div>
          )}
        </div>

        <div className="emr-geo-foot" style={{ borderTop: `1px solid ${FUND.line}`, padding: "10px 22px", display: "flex", justifyContent: "space-between", gap: 12, fontSize: 12, color: FUND.muted, whiteSpace: "nowrap" }}>
          <span>© 2026 EMR</span>
          <span>Map · Europe</span>
        </div>
      </div>

      {/* RIGHT: the map */}
      <div className="emr-geo-map" style={{ background: FUND.paper, position: "relative", overflow: "hidden" }}>
        <MapView
          entries={filtered}
          onSelect={setSelected}
          hover={hover} setHover={setHover}
          selected={selected}
        />
        {hover && (

<script type="text/babel">
/* ==========================================================================
   LOADER — the opening splash
   source: components/loader.jsx
   ========================================================================== */

/* ============================================================================
   Loader — the opening splash

   Twelve stars on a tilted ellipse, turning in their own plane. The stars are
   positioned by the same projection as the logo, and the phase is animated, so
   they travel around the ring rather than the whole image spinning flat — a
   tilted ellipse rotated in 2D reads as a wobble, not a turn.

   The mark carries the name on its own, so there is no wordmark here.

   The standalone bundle shows a static page while it unpacks, and that page is
   deliberately blank. Anything drawn there has to be matched by this loader,
   and a still ring against a turning one reads as a stutter however closely
   the two are sized — so the eye is given nothing to compare. The ring fades
   up from the paper, then the subtitle arrives once it has settled.

   Shown once per browser session: a four-second hold is worth seeing on
   arrival, and tiresome on every reload or back-navigation.
   ========================================================================= */

const LOADER_MS = 4000;   // total time on screen
const LOADER_FADE = 600;  // the tail of that spent fading out
const LOADER_RISE = 500;  // the ring fading up from the paper
const LOADER_CAPTION = 900;  // before the subtitle appears
const LOADER_TURN = Math.PI;  // how far the ring travels: half a turn

// The ring's true extent, so the SVG box hugs the ink rather than padding it.
// Each coordinate is a sine plus a cosine of the same angle, so its envelope
// over a turn is the hypotenuse of the two coefficients — which is well inside
// the nominal radius once the circle is tilted.
const LOADER_RY = 0.55;
// Tilted the same way round as the logo in the navigation, which is mirrored.
// Reversing the sign mirrors the ellipse, which is exact here: a five-pointed
// star drawn point-up is symmetrical about its vertical axis, so only the ring
// changes hand, not the stars.
const LOADER_TILT = 20 * Math.PI / 180;
const LOADER_SR = 0.115;
const LOADER_HALF_W = Math.hypot(Math.cos(LOADER_TILT), LOADER_RY * Math.sin(LOADER_TILT)) + LOADER_SR;
const LOADER_HALF_H = Math.hypot(Math.sin(LOADER_TILT), LOADER_RY * Math.cos(LOADER_TILT)) + LOADER_SR;
const LOADER_ASPECT = LOADER_HALF_W / LOADER_HALF_H;   // ≈ 1.46
const LOADER_GAP = 28;   // between the stars and the subtitle

function EMRLoader({ onDone }) {
  const [phase, setPhase] = React.useState(0);
  const [fading, setFading] = React.useState(false);
  const [captioned, setCaptioned] = React.useState(false);

  // The callback lives in a ref so the animation can run on an empty dependency
  // list. Depending on `onDone` directly restarts the loop whenever the caller
  // passes a fresh function, which resets the clock every frame and leaves the
  // ring standing still.
  const done = React.useRef(onDone);
  done.current = onDone;

  React.useEffect(() => {
    const started = performance.now();
    let frame;

    const tick = (now) => {
      const t = Math.min((now - started) / LOADER_MS, 1);
      // Sine in and out: it drifts up from rest and settles again without ever
      // appearing to race. A quadratic ease has a harder middle, which at this
      // duration reads as the ring being spun rather than turning of its own
      // accord. Half a turn over four seconds is slow enough to watch.
      const eased = -(Math.cos(Math.PI * t) - 1) / 2;
      setPhase(eased * LOADER_TURN);
      if (t < 1) frame = requestAnimationFrame(tick);
    };
    frame = requestAnimationFrame(tick);

    const caption = setTimeout(() => setCaptioned(true), LOADER_CAPTION);
    const fade = setTimeout(() => setFading(true), LOADER_MS - LOADER_FADE);
    const end = setTimeout(() => done.current(), LOADER_MS);
    return () => {
      cancelAnimationFrame(frame);
      clearTimeout(caption); clearTimeout(fade); clearTimeout(end);
    };
  }, []);

  // Twelve points on an ellipse, tilted so the ring reads as a circle lying
  // back from the viewer. Every star is the same size: a ring of identical
  // objects seen at an angle changes its spacing, not its scale.
  //
  // RY sets how far the circle lies back. It cannot go much below 0.55 at this
  // star size: evenly-spaced angles bunch at the ends of the major axis, and
  // past that foreshortening the two stars there touch part-way through every
  // turn. At 0.55 the tightest pair clears by about 4px at the rendered size.
  const RY = LOADER_RY, TILT = LOADER_TILT, SR = LOADER_SR;
  const stars = [];
  for (let i = 0; i < 12; i++) {
    const a = phase + i * Math.PI / 6;
    const px = Math.cos(a), py = RY * Math.sin(a);
    const x = px * Math.cos(TILT) - py * Math.sin(TILT);
    const y = px * Math.sin(TILT) + py * Math.cos(TILT);
    let d = "";
    for (let j = 0; j < 10; j++) {
      const rr = j % 2 ? SR * 0.382 : SR;
      const t = (j / 10) * Math.PI * 2 - Math.PI / 2;
      d += (j ? "L" : "M") + (x + Math.cos(t) * rr).toFixed(4) + "," + (y + Math.sin(t) * rr).toFixed(4);
    }
    stars.push(d + "Z");
  }

  const viewBox = [
    (-LOADER_HALF_W).toFixed(4), (-LOADER_HALF_H).toFixed(4),
    (LOADER_HALF_W * 2).toFixed(4), (LOADER_HALF_H * 2).toFixed(4),
  ].join(" ");

  return (
    <div
      style={{
        position: "fixed", inset: 0, zIndex: 200,
        background: "var(--paper)",
        // One measurement drives the whole composition. It is capped on both
        // axes: a width-only cap leaves the subtitle to clip off the bottom of
        // a short window, since its offset is derived from the ring's size.
        // The vh cap is set so the ring's own height stays within about a
        // third of the viewport, which is what binds in landscape.
        "--ring": `min(249px, 60vw, ${(36 * LOADER_ASPECT).toFixed(0)}vh)`,
        // The ring sits in the centre of the viewport and the subtitle hangs
        // below it, rather than the two being a centred stack. That keeps the
        // stars exactly where the unpack splash leaves them, so the subtitle
        // can arrive without shifting anything.
        display: "flex", alignItems: "center", justifyContent: "center",
        fontFamily: "'Helvetica Neue', Helvetica, Arial, sans-serif",
        color: "var(--ink)",
        opacity: fading ? 0 : 1,
        transition: `opacity ${LOADER_FADE}ms ease`,
        pointerEvents: fading ? "none" : "auto",
      }}
    >
      {/* The fade-in is a CSS animation rather than a transition flipped by
          script. requestAnimationFrame is suspended in a backgrounded tab
          while timers keep firing, so gating the mark's opacity on a rAF
          callback could leave the ring invisible for the whole four seconds —
          a blank page showing only the subtitle. The compositor owns this. */}
      <svg viewBox={viewBox} fill="currentColor" aria-hidden="true" style={{ display: "block", width: "var(--ring)", height: "auto", animation: `emr-rise ${LOADER_RISE}ms ease both` }}>
        {stars.map((d, i) => <path key={i} d={d}></path>)}
      </svg>

      <div
        style={{
          position: "absolute",
          // Half the ring's rendered height, plus the gap. The height follows
          // from the width through the aspect ratio above, so this tracks the
          // ink whichever cap is in force.
          top: `calc(50% + var(--ring) / ${(LOADER_ASPECT * 2).toFixed(3)} + ${LOADER_GAP}px)`,
          left: 0, right: 0,
          fontSize: 13, color: "var(--muted)", textAlign: "center", padding: "0 24px",
          opacity: captioned ? 1 : 0,
          transition: "opacity 700ms ease",
        }}
      >
        A public record of where things are made in Europe
      </div>
    </div>
  );
}

Object.assign(window, { EMRLoader, LOADER_MS });
</script>

<script type="text/babel">
/* ==========================================================================
   APP — screen switching, history, shared state
   source: components/app.jsx
   ========================================================================== */

/* ============================================================================
   App — screen switching and shared state

   Four screens, chosen by `screen`:

     landing    FundLanding      homepage: place list + full-bleed photograph
     registry   FundRegistry     the Index: searchable list + photo gallery
     map        FundGeography    places grouped by country + the map
     submit     FundSubmit       the contribution form

   Everything they share lives here: the search text, the material filter, what
   is under the cursor, and which entry is open in the detail view. Screens
   receive it as props rather than reaching for it, so each one can be read on
   its own.
   ========================================================================= */

const { useState: useStateApp, useEffect: useEffectApp, useMemo: useMemoApp } = React;

// Values the host's tweak panel can write back into this file. Keep the
// EDITMODE markers — they tell it where to save.
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showMap": true
}/*EDITMODE-END*/;

function App() {
  // Which screen is showing. Remembered so a reload does not send the reader
  // back to the homepage.
  const [screen, setScreen] = useStateApp(() => localStorage.getItem("emr_screen") || "landing");

  // Search and filtering, shared by the Index and Geography.
  const [query, setQuery] = useStateApp("");
  const [filters, setFilters] = useStateApp({ material: "all", scale: "all" });

  // `hover` is what the cursor is over; `selected` is what the detail view
  // shows. Separate, because hovering previews and clicking opens.
  const [hover, setHover] = useStateApp(null);
  const [selected, setSelected] = useStateApp(null);

  const [tweaks, setTweaks] = useStateApp(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useStateApp(false);

  // Opening splash. Once per browser session — worth seeing on arrival, and
  // tiresome on every reload or step back through the history.
  const [loading, setLoading] = useStateApp(() => {
    try { return !sessionStorage.getItem("emr_seen"); } catch (e) { return true; }
  });
  const finishLoading = React.useCallback(() => {
    try { sessionStorage.setItem("emr_seen", "1"); } catch (e) {}
    setLoading(false);
  }, []);

  useEffectApp(() => { localStorage.setItem("emr_screen", screen); }, [screen]);

  /* Browser history ---------------------------------------------------------
     Each screen, and each opened entry, is a history step, so the back button
     retraces the visit instead of leaving the site. The reader's position is
     held in the URL hash (#registry, #registry/CZ-007) — which also means a
     link to a maker opens on that maker.

     The homepage is the exception: it is the bare URL, with no hash at all.
     #landing would be noise on the address a reader is most likely to copy,
     and an empty hash already means the homepage.

     `fromHistory` guards the round trip: popstate sets the state, and the
     effect that writes history must not then push the entry it just read. */
  const fromHistory = React.useRef(false);

  const readHash = React.useCallback(() => {
    const [scr, id] = (location.hash || "").replace(/^#/, "").split("/");
    const screens = ["landing", "registry", "map", "submit"];
    return {
      // No hash, or an unrecognised one, is the homepage.
      screen: screens.includes(scr) ? scr : "landing",
      entry: id ? (window.REGISTRY.find(e => e.id === id) || null) : null,
    };
  }, []);

  // Restore whatever the URL asks for on first load, so a shared link lands in
  // the right place. Nothing is written to the address bar here: an unadorned
  // URL is already the homepage, and stamping a hash onto it would also make
  // the reader's first click need two presses of back to leave the site.
  useEffectApp(() => {
    const at = readHash();
    fromHistory.current = true;
    setScreen(at.screen);
    setSelected(at.entry);
    function onPop() {
      const to = readHash();
      fromHistory.current = true;
      setScreen(to.screen);
      setSelected(to.entry);
    }
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);

  useEffectApp(() => {
    // The homepage with nothing open is the bare URL. Its hash is stripped
    // rather than set, so returning home tidies the address bar too.
    const bare = screen === "landing" && !selected;
    const want = bare ? "" : "#" + screen + (selected ? "/" + selected.id : "");
    if (fromHistory.current) { fromHistory.current = false; return; }
    if (location.hash === want) return;
    history.pushState(null, "", want || location.pathname + location.search);
  }, [screen, selected]);

  // Tweak panel handshake with the host. Harmless outside it.
  useEffectApp(() => {
    function handler(e) {
      if (e.data?.type === "__activate_edit_mode") setTweaksOpen(true);
      if (e.data?.type === "__deactivate_edit_mode") setTweaksOpen(false);
    }
    window.addEventListener("message", handler);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", handler);
  }, []);

  function updateTweak(key, value) {
    setTweaks({ ...tweaks, [key]: value });
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [key]: value } }, "*");
  }

  const entries = window.REGISTRY;
  const filtered = useMemoApp(
    () => filterEntries(entries, query, filters),
    [entries, query, filters]
  );

  return (
    <div style={{ minHeight: "100vh", position: "relative", background: "var(--paper)" }} data-screen-label={`EMR / ${screen}`}>
      {loading && <EMRLoader onDone={finishLoading} />}

      <FundNav screen={screen} setScreen={setScreen} />

      {screen === "landing" && (
        <FundLanding
          setScreen={setScreen}
          registry={entries}
          onSelect={setSelected}
        />
      )}

      {screen === "registry" && (
        <FundRegistry
          filtered={filtered} total={entries.length}
          query={query} setQuery={setQuery}
          filters={filters} setFilters={setFilters}
          hover={hover} setHover={setHover}
          selected={selected} setSelected={setSelected}
          showGrid={tweaks.showMap}
        />
      )}

      {screen === "map" && (
        <FundGeography
          entries={entries} filtered={filtered}
          query={query} setQuery={setQuery}
          filters={filters} setFilters={setFilters}
          hover={hover} setHover={setHover}
          selected={selected} setSelected={setSelected}
        />
      )}

      {screen === "submit" && (
        <FundSubmit
          setScreen={setScreen}
          registry={entries}
          showGrid={tweaks.showMap}
          onSelect={setSelected}
        />
      )}

      {/* Sits above every screen; renders nothing when no entry is selected.
          The back link names wherever the reader came from. */}
      <FundDetail
        entry={selected}
        onClose={() => setSelected(null)}
        setScreen={setScreen}
        backLabel={
          screen === "submit" ? "Back to submit a maker"
          : screen === "landing" ? "Back to the registry"
          : null
        }
      />

      {tweaksOpen && (
        <div style={{ position: "fixed", right: 18, bottom: 18, zIndex: 90, background: "var(--paper)", color: "var(--ink)", border: "1px solid var(--ink)", padding: "7px 10px", fontFamily: "'Helvetica Neue', Helvetica, Arial, sans-serif", fontSize: 12, display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ color: "var(--muted)" }}>Side gallery</span>
          <button
            onClick={() => updateTweak("showMap", !tweaks.showMap)}
            style={{ width: 26, height: 14, border: "1px solid var(--ink)", background: tweaks.showMap ? "var(--ink)" : "transparent", position: "relative", cursor: "pointer", padding: 0 }}
          >
            <span style={{ position: "absolute", top: 1, left: tweaks.showMap ? 13 : 1, width: 10, height: 10, background: tweaks.showMap ? "var(--paper)" : "var(--ink)", transition: "left 120ms" }} />
          </button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
